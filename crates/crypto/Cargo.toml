[package]
name = "spacejam-crypto"
version = "0.0.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true, optional = true }
ark-ec = { workspace = true, optional = true }
ark-serialize = { workspace = true, optional = true }
ark-vrf = { workspace = true, optional = true }
blake2 = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
once_cell = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
ring = { workspace = true, optional = true }
tiny-keccak = { workspace = true, optional = true }
w3f-bls = { workspace = true, optional = true }
tracing.workspace = true

[features]
default = []
blake2 = ["dep:blake2"]
blake3 = ["dep:blake3"]
bls = ["w3f-bls"]
ed25519 = ["anyhow", "ed25519-dalek"]
keccak = ["tiny-keccak"]
merkle = ["blake2", "keccak"]
rand = ["dep:rand"]
shuffle = ["blake2"]
tls = ["rcgen", "ed25519-dalek/pkcs8"]
vrf = ["anyhow", "ark-vrf", "ark-ec", "ark-serialize", "once_cell", "ring"]

[dev-dependencies]
hex.workspace = true

[build-dependencies]
ark-serialize.workspace = true
ark-vrf.workspace = true
