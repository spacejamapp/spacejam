[package]
name = "spacejam"
version.workspace = true
edition.workspace = true

[[bin]]
name = "spacejam"
path = "bin/spacejam.rs"

[dependencies]
account.workspace = true
anyhow.workspace = true
async-trait.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
codec.workspace = true
crypto = { workspace = true, features = ["bls", "ed25519", "vrf"] }
dhat = { workspace = true, optional = true }
dirs.workspace = true
hex.workspace = true
network = { workspace = true, features = ["cmd"] }
offchain.workspace = true
parity-db.workspace = true
spacevm.workspace = true
rand.workspace = true
rayon.workspace = true
runtime.workspace = true
score.workspace = true
serde.workspace = true
serde_json.workspace = true
spacejson.workspace = true
sysinfo.workspace = true
testing.workspace = true
time = { workspace = true, features = ["local-offset"] }
toml.workspace = true
tokio = { workspace = true, features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "net",
    "macros",
    "signal",
] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "time"] }

[dev-dependencies]
temp-dir.workspace = true

[build-dependencies]
syn.workspace = true
proc-macro2.workspace = true
quote.workspace = true

[features]
default = ["tiny"]
dhat = ["dep:dhat"]
tiny = ["score/tiny"]
full = ["score/full"]
