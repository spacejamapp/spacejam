[package]
name = "spacejam-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
codec.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
spacejson.workspace = true

# crypto features
crypto = { workspace = true, features = [
    "blake2",
    "ed25519",
    "merkle",
    "shuffle",
], optional = true }

[features]
default = []
crypto = ["dep:crypto"]
