[package]
name = "spacejam-core"
version = "0.0.0"
edition = "2021"

[dependencies]
anyhow.workspace = true
codec.workspace = true
hex.workspace = true
metrics.workspace = true
serde.workspace = true
serde_json.workspace = true
spacejson.workspace = true
