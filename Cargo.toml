[workspace]
members = ["crates/*", "crates/codec/derive"]
resolver = "1"

[workspace.dependencies]
core = { path = "crates/core", package = "spacejam-core" }
codec = { path = "crates/codec", package = "jamcodec" }
codec-derive = { path = "crates/codec/derive", package = "jamcodec-derive" }

# crates.io
anyhow = "1.0.93"
git2 = "0.19.0"
hex = "0.4.3"
paste = "1.0.15"
proc-macro2 = "1.0.92"
quote = "1.0.33"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
syn = "2.0.90"

# dev 
scale = { package = "parity-scale-codec", version = "3.6.12", features = [
    "derive",
    "serde",
], git = "https://github.com/turbofishxyz/jamcodec.git" }
