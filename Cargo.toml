[workspace]
members = [
    "crates/*",
    "crates/codec/erasure",
    "crates/codec/json",
    "crates/codec/json/derive",
    "crates/offchain/worker",
    "crates/offchain/rpc",
    "crates/pvm/cli",
    "crates/pvm/compiler",
    "crates/pvm/cranelift",
    "crates/pvm/interpreter",
    "crates/pvm/parser",
    "crates/pvm/testing",
    "crates/testing/spec",
    "polkajam/*",
    "services/*",
]
resolver = "1"

[workspace.package]
edition = "2021"
version = "0.0.7"
homepage = "https://github.com/spacejamapp/spacejam"
repository = "https://github.com/spacejamapp/spacejam"
license = "GPL-3.0"
authors = ["clearloop <tianyi.gc@gmail.com>"]

[profile.prod]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
debug-assertions = false
overflow-checks = false
strip = true

[workspace.dependencies]
codec = { path = "crates/codec", package = "jamcodec" }
cjam = { path = "crates/pvm/cli", package = "cargo-jam" }
crypto = { path = "crates/crypto", package = "spacejam-crypto" }
erasure = { path = "crates/codec/erasure", package = "spacejam-erasure" }
network = { path = "crates/network", package = "spacejam-network" }
offchain = { path = "crates/offchain", package = "spacejam-offchain" }
pvm = { path = "crates/pvm", package = "pvm" }
pvmi = { path = "crates/pvm/interpreter" }
pvmc = { path = "crates/pvm/compiler" }
pvm-parser = { path = "crates/pvm/parser" }
pvm-testing = { path = "crates/pvm/testing" }
translator = { path = "crates/pvm/cranelift", package = "cranelift-pvm" }
rpc = { path = "crates/offchain/rpc", package = "spacejam-rpc" }
runtime = { path = "crates/runtime", package = "spacejam-runtime" }
score = { path = "crates/core", package = "spacejam-core" }
serde-jam = { path = "crates/codec", package = "jamcodec" }
spacejam = { path = "crates/spacejam", package = "spacejam" }
spacejson = { path = "crates/codec/json", package = "spacejson" }
spacejson-derive = { path = "crates/codec/json/derive", package = "spacejson-derive" }
specjam = { path = "crates/testing/spec", package = "specjam" }
testing = { path = "crates/testing", package = "spacejam-testing" }
validator = { path = "crates/spacejam/validator", package = "spacejam-validator" }
worker = { path = "crates/offchain/worker", package = "spacejam-worker" }

# polkajam dependencies
bounded-collections = { version = "0.3.2", default-features = false }
jam-types = { version = "0.1.22", default-features = false }
jam-codec = "0.1.0"
jam-pvm-build = "0.1.22"
jam-pvm-builder = "0.1.22"
jam-pvm-common = { version = "0.1.22", default-features = false }
jam-program-blob = "0.1.22"
polkavm-linker = "0.24.0"
polkavm-derive = "0.24.0"
polkavm-common = "0.24.0"
podec = { version = "0.1.0", package = "jam-codec", default-features = false, features = [
    "derive",
] }

# crates.io
anyhow = "1.0.93"
ark-bls12-381 = "0.5.0"
ark-ec = { version = "0.5", default-features = false }
ark-ff = { version = "0.5", default-features = false }
ark-std = { version = "0.5", default-features = false }
ark-serialize = { version = "0.5", default-features = false }
ark-vrf = { version = "0.1.0", features = ["bandersnatch", "ring", "parallel"] }
async-trait = "0.1.88"
blake2 = "0.10.6"
clap = "4.5.23"
colored = "3.0.0"
cranelift = "0.120.0"
cranelift-codegen = "0.120.0"
cranelift-frontend = "0.120.0"
cranelift-native = "0.120.0"
cranelift-jit = "0.120.0"
cranelift-module = "0.120.0"
dirs = "6.0.0"
ed25519-dalek = "2.1.1"
etc = "0.1.20"
git2 = "0.19.0"
heck = "0.5.0"
hex = "0.4.3"
hyper = "1.6"
hyper-util = "0.1.11"
jobserver = "0.1.33"
jsonrpsee = "0.24.9"
libc = "0.2"
log = "0.4.27"
once_cell = "1.20.2"
paste = "1.0.15"
parity-db = "0.5.1"
proc-macro2 = "1.0.92"
prometheus = { version = "0.23.1", package = "prometheus-client" }
quinn = "0.11.6"
quote = "1.0.33"
rand = "0.8.5"
rand_xoshiro = "0.6.0"
rcgen = "0.13.2"
reed-solomon = { package = "reed-solomon-simd", version = "3.0.1" }
ring = { package = "w3f-ring-proof", version = "0.0.2", default-features = false }
rustls = "0.23.23"
rustls-webpki = "0.102.8"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
syn = "2.0.90"
sysinfo = "0.36.1"
temp-dir = "0.1.16"
time = "0.3.41"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
tokio = { version = "1.42.0", features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "net",
    "macros",
    "process",
    "time",
    "io-util",
] }
tokio-stream = "0.1.17"
toml = { version = "0.8.19", features = ["parse"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", default-features = false, features = [
    "env-filter",
    "fmt",
    "ansi",
    "std",
] }
trait-variant = "0.1.2"
uint = "0.10.0"
w3f-bls = "0.1.8"
x509-parser = "0.17.0"

[patch.crates-io]
jam-types = { path = "polkajam/jam-types" }
jam-pvm-common = { path = "polkajam/jam-pvm-common" }
