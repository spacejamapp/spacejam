[workspace]
members = [
    "crates/*",
    "crates/codec/erasure",
    "crates/codec/json",
    "crates/codec/json/derive",
    "crates/core/metrics",
    "crates/core/sync",
    "crates/pvm/parser",
    "crates/pvm/interpreter",
]
resolver = "1"

[workspace.dependencies]
score = { path = "crates/core", package = "spacejam-core" }
codec = { path = "crates/codec", package = "jamcodec" }
crypto = { path = "crates/crypto", package = "spacejam-crypto" }
merkle = { path = "crates/crypto/merkle", package = "spacejam-merkle" }
metrics = { path = "crates/core/metrics", package = "spacejam-metrics" }
network = { path = "crates/network", package = "spacejam-network" }
parser = { path = "crates/pvm/parser", package = "pvm-parser" }
pvmi = { path = "crates/pvm/interpreter" }
spacejam = { path = "crates/spacejam", package = "spacejam" }
spacejson = { path = "crates/codec/json", package = "spacejson" }
spacejson-derive = { path = "crates/codec/json/derive", package = "spacejson-derive" }
sync = { path = "crates/core/sync", package = "spacejam-sync" }
validator = { path = "crates/spacejam/validator", package = "spacejam-validator" }

# crates.io
anyhow = "1.0.93"
ark-bls12-381 = "0.5.0"
ark-ec = "0.5.0"
ark-ff = "0.5.0"
ark-serialize = "0.5.0"
ark-std = "0.5.0"
blake2 = "0.10.6"
clap = "4.5.23"
ed25519-dalek = "2.1.1"
git2 = "0.19.0"
heck = "0.5.0"
hex = "0.4.3"
hyper = "1.5.2"
hyper-util = "0.1.3"
litep2p = "0.8.4"
mmr = { package = "polkadot-ckb-merkle-mountain-range", version = "0.8.1" }
once_cell = "1.20.2"
paste = "1.0.15"
proc-macro2 = "1.0.92"
prometheus = { version = "0.23.1", package = "prometheus-client" }
quote = "1.0.33"
rand = "0.8.5"
rand_xoshiro = "0.6.0"
rcgen = "0.13.2"
reed-solomon = { package = "reed-solomon-simd", version = "3.0.1" }
rocksdb = "0.22.0"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
sled = "0.34.7"
specjam = "0.0.4"
syn = "2.0.90"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
tokio = { version = "1.42.0", features = ["rt", "sync", "net", "macros"] }
tokio-stream = "0.1.17"
toml = "0.8.19"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
trait-variant = "0.1.2"
w3f-bls = "0.1.8"

# git dependencies
ark-ec-vrfs = { git = "https://github.com/davxy/ark-ec-vrfs", rev = "d90e180", features = [
    "bandersnatch",
    "ring",
    "parallel",
] }
ring = { git = "https://github.com/davxy/ring-proof", rev = "db13482", default-features = false }
