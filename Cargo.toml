[workspace]
resolver = "1"
members = [
    "crates/*",
    "crates/core/assurance",
    "crates/core/dispute",
    "crates/core/report",
    "crates/core/safrole",
    "crates/validator/authoring",
    "crates/validator/validation",
    "crates/pvm/parser",
    "crates/pvm/interpreter",
    "crates/codec/erasure",
    "crates/codec/json",
    "crates/codec/json/derive",
]

[workspace.dependencies]
assurance = { path = "crates/core/assurance", package = "spacejam-assurance" }
score = { path = "crates/core", package = "spacejam-core" }
codec = { path = "crates/codec", package = "jamcodec" }
crypto = { path = "crates/crypto", package = "spacejam-crypto" }
dispute = { path = "crates/core/dispute", package = "spacejam-dispute" }
validator = { path = "crates/validator", package = "spacejam-validator" }
merkle = { path = "crates/crypto/merkle", package = "spacejam-merkle" }
parser = { path = "crates/pvm/parser", package = "pvm-parser" }
pvmi = { path = "crates/pvm/interpreter" }
report = { path = "crates/core/report", package = "spacejam-report" }
safrole = { path = "crates/core/safrole", package = "spacejam-safrole" }
spacejam = { path = "crates/spacejam", package = "spacejam" }
spacejson = { path = "crates/codec/json", package = "spacejson" }
spacejson-derive = { path = "crates/codec/json/derive", package = "spacejson-derive" }
statistic = { path = "crates/statistic", package = "spacejam-statistic" }

# crates.io
anyhow = "1.0.93"
async-lock = "3.4.0"
blake2 = "0.10.6"
ed25519-dalek = "2.1.1"
git2 = "0.19.0"
heck = "0.5.0"
hex = "0.4.3"
mmr = { package = "polkadot-ckb-merkle-mountain-range", version = "0.8.1" }
once_cell = "1.20.2"
paste = "1.0.15"
proc-macro2 = "1.0.92"
quote = "1.0.33"
rand = "0.8.5"
rand_xoshiro = "0.6.0"
reed-solomon = { package = "reed-solomon-simd", version = "3.0.1" }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
syn = "2.0.90"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
toml = "0.8.19"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

# git dependencies
ark-ec-vrfs = { git = "https://github.com/davxy/ark-ec-vrfs", rev = "d90e180", features = [
    "bandersnatch",
    "ring",
    "parallel",
] }
ring = { git = "https://github.com/davxy/ring-proof", rev = "db13482", default-features = false }
