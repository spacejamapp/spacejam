[workspace]
members = [
    "crates/*",
    "crates/codec/erasure",
    "crates/codec/json",
    "crates/codec/json/derive",
    "crates/core/account",
    "crates/core/service",
    "crates/offchain/worker",
    "crates/offchain/rpc",
    "crates/vm/compiler",
    "crates/vm/cranelift",
    "crates/vm/export",
    "crates/vm/interpreter",
    "crates/vm/spacevm",
    "crates/vm/parser",
    "crates/testing/spec",
]
resolver = "1"

[workspace.package]
edition = "2024"
version = "0.0.26"
homepage = "https://spacejam.app"
repository = "https://github.com/spacejamapp/jade"
license = "GPL-3.0"
authors = ["clearloop <tianyi.gc@gmail.com>"]

[profile.prod]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
debug-assertions = false
overflow-checks = false
strip = true

[workspace.dependencies]
account = { path = "crates/core/account", package = "spacejam-account" }
codec = { path = "crates/codec", package = "serde-jam", version = "0.0.26" }
cjam = { path = "crates/vm/cli", package = "cargo-jam" }
crypto = { path = "crates/crypto", package = "spacejam-crypto" }
erasure = { path = "crates/codec/erasure", package = "spacejam-erasure" }
network = { path = "crates/network", package = "spacejam-network" }
offchain = { path = "crates/offchain", package = "spacejam-offchain" }
pvm = { path = "crates/vm", package = "pvm" }
pvmi = { path = "crates/vm/interpreter" }
pvmc = { path = "crates/vm/compiler" }
pvm-parser = { path = "crates/vm/parser" }
pvm-testing = { path = "crates/vm/testing" }
service = { path = "crates/core/service", package = "spacejam-service", version = "0.0.26" }
translator = { path = "crates/vm/cranelift", package = "cranelift-pvm" }
rpc = { path = "crates/offchain/rpc", package = "spacejam-rpc" }
runtime = { path = "crates/runtime", package = "spacejam-runtime" }
score = { path = "crates/core", package = "spacejam-core" }
spacejam = { path = "crates/spacejam", package = "spacejam" }
spacejson = { path = "crates/codec/json", package = "spacejson", version = "0.0.26" }
spacejson-derive = { path = "crates/codec/json/derive", package = "spacejson-derive", version = "0.0.26" }
specjam = { path = "crates/testing/spec", package = "specjam" }
spacevm = { path = "crates/vm/spacevm", package = "spacevm" }
testing = { path = "crates/testing", package = "spacejam-testing" }
validator = { path = "crates/spacejam/validator", package = "spacejam-validator" }
worker = { path = "crates/offchain/worker", package = "spacejam-worker" }

# crates.io
anyhow = { version = "1.0.99", default-features = false }
ark-bls12-381 = "0.5.0"
ark-ec = { version = "0.5", default-features = false }
ark-ed-on-bls12-381-bandersnatch = { version = "0.5", default-features = false }
ark-ff = { version = "0.5", default-features = false }
ark-std = { version = "0.5", default-features = false }
ark-serialize = { version = "0.5", default-features = false }
ark-vrf = { version = "0.1.0", features = ["bandersnatch", "ring", "parallel"] }
async-trait = "0.1.89"
bindgen = "0.72"
blake2 = { version = "0.10.6", default-features = false }
blake3 = "1.8.2"
cc = "1.2"
clap = "4.5.47"
colored = "3.0.0"
cranelift = "0.123.2"
cranelift-codegen = "0.123.2"
dirs = "6.0.0"
ed25519-zebra = "4.1.0"
erased-serde = "0.4.9"
etc = "0.1.20"
git2 = "0.19.0"
heck = "0.5.0"
hex = { version = "0.4.3", default-features = false }
indexmap = "2.13.0"
hyper = "1.7"
hyper-util = "0.1.16"
jobserver = "0.1.34"
jsonrpsee = "0.24.9"
libc = "0.2"
log = "0.4.28"
once_cell = "1.21.3"
paste = "1.0.15"
parity-db = "0.5.4"
postcard = "1.1.3"
proc-macro2 = "1.0.101"
prometheus = { version = "0.23.1", package = "prometheus-client" }
quinn = "0.11.9"
quote = "1.0.40"
rand = "0.8.5"
rayon = "1.11.0"
rcgen = "0.13.2"
reed-solomon = { package = "reed-solomon-simd", version = "3.0.1" }
ring = { package = "w3f-ring-proof", version = "0.0.2", default-features = false }
rustls = "0.23.31"
rustls-webpki = "0.102.8"
serde = { version = "1.0.219", features = ["derive"], default-features = false }
serde_json = { version = "1.0.143", default-features = false }
syn = "2.0.106"
sysinfo = "0.36.1"
temp-dir = "0.1.16"
time = "0.3.43"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
tokio = { version = "1.47.1", features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "net",
    "macros",
    "process",
    "time",
    "io-util",
] }
tokio-stream = "0.1.17"
toml = { version = "0.8.23", features = ["parse"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", default-features = false, features = [
    "env-filter",
    "fmt",
    "ansi",
    "std",
    "tracing-log",
] }
trait-variant = "0.1.2"
uint = "0.10.0"
w3f-bls = "0.1.9"
x509-parser = "0.17.0"

[patch.crates-io]
# w3f-ring-proof = { git = "https://github.com/sunhuachuang/ring-proof" }
# ark-vrf = { git = "https://github.com/sunhuachuang/ark-vrf" }

[workspace.metadata.conta]
packages = ["codec", "spacejson-derive", "spacejson", "service"]
