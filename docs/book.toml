[book]
authors = ["clearloop"]
language = "en"
multilingual = false
src = "src"
title = "SpaceJam"
description = "SpaceJam handbook."

[output.html]
additional-js = ["js/mermaid.min.js", "js/mermaid-init.js"]
git-repository-url = "https://github.com/clearloop/spacejam"

[output.html.fold]
enable = true

[output.html.playground]
runnable = false

[preprocessor.mermaid]
command = "mdbook-mermaid"
