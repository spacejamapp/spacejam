global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: 'spacejam'
    static_configs:
      - targets:
        - 'spacejam-1:9091'
        - 'spacejam-2:9092'
        - 'spacejam-3:9093'
        - 'spacejam-4:9094'
        - 'spacejam-5:9095'
        - 'spacejam-6:9096'
    metrics_path: '/metrics'
    scheme: 'http'
    metric_relabel_configs:
      # Standardize connection metric names
      - source_labels: [__name__]
        regex: 'spacejam_.*_conn'
        target_label: __name__
        replacement: 'spacejam_conn'

      # Preserve peer information
      - source_labels: [peer]
        target_label: peer
        regex: '(.*)'
        replacement: '$1'

      # Add instance label for better filtering
      - target_label: instance_name
        replacement: '${1}'
        source_labels: [instance]
        regex: '([^:]+).*'