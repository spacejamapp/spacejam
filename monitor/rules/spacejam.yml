groups:
  - name: spacejam_network
    interval: 15s
    rules:
      # Connection status by peer
      - record: spacejam:conn:status
        expr: sum by (peer) (spacejam_conn)

      # Total active connections
      - record: spacejam:conn:active:total
        expr: count(spacejam_conn == 1)

      # Total inactive connections
      - record: spacejam:conn:inactive:total
        expr: count(spacejam_conn == 0)

      # Connection rate over time (5m rate of status changes)
      - record: spacejam:conn:change_rate:5m
        expr: rate(spacejam_conn[5m])

      # Connection uptime percentage
      - record: spacejam:conn:uptime:ratio
        expr: sum(spacejam_conn == 1) / count(spacejam_conn)